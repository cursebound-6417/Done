<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIGH SCHOOL — THE GAME</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#08090d;color:#f5f7fb}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#25204b55,transparent 35%),radial-gradient(circle at 80% 90%,#16495a44,transparent 35%);pointer-events:none}.wrap{width:min(1050px,92%);margin:auto;padding:28px 0 60px;position:relative}.brand{letter-spacing:.12em;font-weight:900;font-size:clamp(25px,5vw,46px)}.sub{color:#9da4b3}.card{background:#12151dce;border:1px solid #282d39;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 15px 50px #0005;backdrop-filter:blur(8px)}h2{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input,textarea{font:inherit;border-radius:13px;padding:13px;border:1px solid #333a49;background:#0c0f15;color:#fff}button{cursor:pointer;background:#fff;color:#08090d;border:0;font-weight:800}button.secondary{background:#202531;color:#fff}.hidden{display:none}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#252a36;color:#cbd2df;font-size:13px}.ok{background:#153d2a;color:#9af0bd}.wait{background:#3b3215;color:#f2d67d}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.playercard{padding:14px;border:1px solid #292f3b;border-radius:15px;background:#0d1016}.answer{white-space:pre-wrap;margin-top:9px;padding:10px;background:#090b10;border-radius:10px;color:#dfe4ec}.question{font-size:clamp(20px,3vw,30px);line-height:1.35}.bigcode{font-size:32px;font-weight:900;letter-spacing:.16em}.progress{height:8px;background:#262b35;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#fff}.hint{font-size:13px;color:#858d9d}.error{color:#ff9c9c}.counter{font-weight:800}.nav{max-height:160px;overflow:auto}.nav button{min-width:44px}.sticky{position:sticky;top:10px;z-index:5}
</style></head><body><div class="wrap"><div class="brand">HIGH SCHOOL</div><div class="sub">THE GAME · honest answers · one shared room</div>
<section id="home" class="card"><h2>Start a game</h2><p class="sub">Create a private room for up to <b>100 players</b>, or join one with a room code.</p><div class="row"><button onclick="host()">Create host room</button><button class="secondary" onclick="show('join')">Join a room</button></div></section>
<section id="join" class="card hidden"><h2>Join</h2><div class="row"><input id="code" placeholder="ROOM CODE" maxlength="6"><input id="name" placeholder="Your name" maxlength="40"><button onclick="join()">Join game</button></div><p id="joinmsg" class="hint"></p></section>
<section id="host" class="hidden"><div class="card sticky"><div class="row" style="justify-content:space-between"><div><div class="sub">HOST ROOM</div><div class="bigcode" id="roomCode"></div></div><div id="qr" style="background:#fff;padding:10px;border-radius:14px"></div></div><p class="hint" id="joinUrl"></p></div><div class="card"><div class="row" style="justify-content:space-between"><h2>Participants</h2><div class="counter"><span id="count">0</span>/100</div></div><div id="players" class="grid"></div></div><div class="card"><div class="sub">QUESTION <span id="hq">1</span>/20</div><p class="question" id="hqtext"></p><div class="progress"><i id="prog"></i></div><br><div class="nav row" id="nav"></div></div></section>
<section id="player" class="hidden"><div class="card"><div class="sub">ROOM <b id="pcode"></b></div><div class="sub">QUESTION <span id="pqnum">1</span>/20</div><p class="question" id="pquestion"></p><textarea id="answer" rows="8" style="width:100%;resize:vertical" placeholder="Write whatever you genuinely think…"></textarea><br><div class="row"><button onclick="submitAnswer()">Submit answer</button><span id="saved" class="hint"></span></div></div></section>
</div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
let ws,mode,roomCode,playerId,current=1,questions=[];
const $=id=>document.getElementById(id);function show(id){['home','join'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>{if(mode==='player')$('saved').textContent='Connection lost — refresh to reconnect.'}}
function host(){mode='host';connect();ws.onopen=()=>ws.send(JSON.stringify({type:'host_create'}))}
function join(){mode='player';roomCode=$('code').value.trim().toUpperCase();let n=$('name').value.trim();if(!roomCode||!n){$('joinmsg').textContent='Enter a room code and your name.';return}connect();ws.onopen=()=>ws.send(JSON.stringify({type:'player_join',code:roomCode,name:n}))}
function handle(m){if(m.type==='error'){if(mode==='player')$('joinmsg').textContent=m.message;else alert(m.message);return}if(m.type==='host_ready'){roomCode=m.code;questions=m.questions;$('home').classList.add('hidden');$('host').classList.remove('hidden');$('roomCode').textContent=roomCode;let u=location.origin+'/?room='+roomCode;$('joinUrl').textContent='Join link: '+u;$('qr').innerHTML='';new QRCode($('qr'),{text:u,width:160,height:160});renderHost({current:1,players:[],questions});return}if(m.type==='player_ready'){playerId=m.id;$('join').classList.add('hidden');$('player').classList.remove('hidden');$('pcode').textContent=m.code}if(m.type==='state'){current=m.current;questions=m.questions;mode==='host'?renderHost(m):renderPlayer(m)}}
function renderHost(s){$('count').textContent=s.players.length;$('hq').textContent=s.current;$('hqtext').textContent=s.questions[s.current-1].text;$('prog').style.width=(s.current/20*100)+'%';let nav=$('nav');nav.innerHTML='';s.questions.forEach(q=>{let b=document.createElement('button');b.textContent=q.id;b.className=q.id===s.current?'':'secondary';b.onclick=()=>ws.send(JSON.stringify({type:'set_question',question:q.id}));nav.appendChild(b)});let p=$('players');p.innerHTML='';s.players.forEach(x=>{let d=document.createElement('div');d.className='playercard';let ans=x.answers[s.current];d.innerHTML='<b>'+esc(x.name)+'</b> '+(x.connected?'🟢':'⚪')+'<div class="pill '+(ans!==undefined?'ok':'wait')+'">'+(ans!==undefined?'Submitted':'Not submitted')+'</div>'+(ans!==undefined?'<div class="answer">'+esc(ans)+'</div>':'');p.appendChild(d)})}
function renderPlayer(s){let q=s.questions[s.current-1];$('pqnum').textContent=s.current;$('pquestion').textContent=q.text;let mine=s.players.find(x=>x.id===playerId);if(mine&&mine.answers[s.current]!==undefined){$('answer').value=mine.answers[s.current];$('saved').textContent='✓ Submitted — you can edit and submit again.'}else{$('answer').value='';$('saved').textContent=''}}
function submitAnswer(){ws.send(JSON.stringify({type:'submit',question:current,answer:$('answer').value}));$('saved').textContent='✓ Submitted'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
let params=new URLSearchParams(location.search);if(params.get('room')){show('join');$('code').value=params.get('room').toUpperCase()}
</script></body></html>
